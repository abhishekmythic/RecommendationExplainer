version: '3.8'

services:
  recommendationexplainer-app:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_SSL=true
    ports:
      - "8501:8501"
    restart: unless-stopped
